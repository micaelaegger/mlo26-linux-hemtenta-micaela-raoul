services:
  api:                                # Our FastAPI app
    build: ./api                      # Build the image from api/Dockerfile
    env_file: ./api/.env              # Load environment variables from .env
    ports:
      - "127.0.0.1:8000:8000"         # Map host port 8000 to the container, local access only
    depends_on:
      db:
        condition: service_healthy    # Start only when the database is ready
    restart: unless-stopped           # Restart unless we stopped it ourselves

  db:                                 # This name is used as DB_HOST
    image: postgres:17-alpine         # Prebuilt Postgres image from Docker Hub
    env_file: ./api/.env              # POSTGRES_* create the database and user
    volumes:
      - db_data:/var/lib/postgresql/data   # Keep the data outside the container
    healthcheck:                      # Checks that Postgres accepts connections
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]   # $$ = read the variable inside the container
      interval: 5s                    # Check every 5 seconds
      timeout: 5s                     # Count as failed after 5 seconds
      retries: 10                     # Failures allowed before it counts as unhealthy
    restart: unless-stopped           # Restart unless we stopped it ourselves

volumes:
  db_data:                            # Creates the volume used by db
