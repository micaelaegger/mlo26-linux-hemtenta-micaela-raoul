gare: tjänst eller root</text><rect fill="#FFFFFF" height="80" rx="12" ry="12" stroke="#D9E3EE" stroke-width="2" width="1370" x="65" y="710" /><rect fill="#BE7A18" height="80" rx="3" ry="3" stroke="none" stroke-width="2" width="10" x="65" y="710" /><text fill="#1D3045" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="25" font-weight="800" text-anchor="start" x="95" y="741">/var/backups/book-api/</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="95" y="770">Databasdump  •  återställningsfiler</text><text fill="#BE7A18" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" x="875" y="740">Backuper</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="875" y="768">Ägare: begränsad åtkomst</text><rect fill="#FFFFFF" height="80" rx="12" ry="12" stroke="#D9E3EE" stroke-width="2" width="1370" x="65" y="805" /><rect fill="#118E86" height="80" rx="3" ry="3" stroke="none" stroke-width="2" width="10" x="65" y="805" /><text fill="#1D3045" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="25" font-weight="800" text-anchor="start" x="95" y="836">/var/lib/docker/</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="95" y="865">Volymer  •  containerdata</text><text fill="#118E86" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" x="875" y="835">Runtime state</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="875" y="863">Ägare: Docker-hanterat</text><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start" x="66" y="935">Grundidé: källkod kan versionshanteras; hemligheter och databasinnehåll ska skyddas separat.</text><line fill="none" stroke="#D9E3EE" stroke-linecap="round" stroke-width="2" x1="65" x2="1435" y1="964" y2="964" /><text fill="#8295A6" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="65" y="993">Illustrativ målstruktur — ingen katalog behöver flyttas före kontroll av beroenden</text><text fill="#8295A6" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="end" x="1433" y="993">BOOK API  /  LINUX-PRIMER</text></svg>