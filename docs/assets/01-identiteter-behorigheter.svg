<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="960px" version="1.1" viewBox="0 0 1540 960" width="1540px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="5"><path d="M0,0 L10,5 L0,10 Z" fill="#3D6FDB" /></marker><marker id="arrow-teal" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="5"><path d="M0,0 L10,5 L0,10 Z" fill="#118E86" /></marker><marker id="arrow-muted" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="5"><path d="M0,0 L10,5 L0,10 Z" fill="#5B6F83" /></marker></defs><rect fill="#F6F9FC" height="960" width="1540" x="0" y="0" /><rect fill="#118E86" height="15" rx="0" ry="0" stroke="none" stroke-width="2" width="1540" x="0" y="0" /><text fill="#118E86" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="19" font-weight="800" letter-spacing="1.8px" text-anchor="start" x="65" y="75">01 / IDENTITETER</text><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="44" font-weight="800" text-anchor="start" x="65" y="132">Vem får göra vad?</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" x="66" y="176">Användarnamn är inte samma sak som behörighet — UID, grupper och resursregler avgör.</text><line fill="none" stroke="#D9E3EE" stroke-linecap="round" stroke-width="2" x1="65" x2="1475" y1="199" y2="199" /><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="21" font-weight="800" letter-spacing="0.7px" text-anchor="start" x="65" y="246">KONTON / IDENTITETER</text><text fill="#8295A6" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="65" y="280">Vem utför operationen?</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="21" font-weight="800" letter-spacing="0.7px" text-anchor="start" x="590" y="246">GRUPPER</text><text fill="#8295A6" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="590" y="280">Vilket delat medlemskap?</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="21" font-weight="800" letter-spacing="0.7px" text-anchor="start" x="1070" y="246">RESURSER</text><text fill="#8295A6" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="1070" y="280">Vilken åtkomst är tillåten?</text><rect fill="#FFFFFF" height="106" rx="14" ry="14" stroke="#D9E3EE" stroke-width="2" width="448" x="65" y="310" /><rect fill="#3D6FDB" height="106" rx="3" ry="3" stroke="none" stroke-width="2" width="9" x="65" y="310" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="26" font-weight="800" text-anchor="start" x="90" y="346">raoul + micaela</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="90" y="376">Mänskliga adminkonton</text><text fill="#8295A6" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="90" y="402">sudo kan ge root-rättigheter</text><rect fill="#FFFFFF" height="106" rx="14" ry="14" stroke="#D9E3EE" stroke-width="2" width="448" x="65" y="440" /><rect fill="#118E86" height="106" rx="3" ry="3" stroke="none" stroke-width="2" width="9" x="65" y="440" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="26" font-weight="800" text-anchor="start" x="90" y="476">deploy</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="90" y="506">Automatiserad inloggning</text><text fill="#8295A6" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="90" y="532">Egen hemkatalog och SSH-nycklar</text><rect fill="#FFFFFF" height="106" rx="14" ry="14" stroke="#D9E3EE" stroke-width="2" width="448" x="65" y="570" /><rect fill="#BE7A18" height="106" rx="3" ry="3" stroke="none" stroke-width="2" width="9" x="65" y="570" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="26" font-weight="800" text-anchor="start" x="90" y="606">book-api</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="90" y="636">Valfritt host-tjänstekonto</text><text fill="#8295A6" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="90" y="662">Behöver inte hantera Docker</text><rect fill="#FFFFFF" height="106" rx="14" ry="14" stroke="#D9E3EE" stroke-width="2" width="400" x="590" y="310" /><rect fill="#EBF2FF" height="30" rx="13" ry="13" stroke="none" stroke-width="2" width="65" x="609" y="324" /><text fill="#3D6FDB" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" x="621" y="345">sudo</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="610" y="388">Högre behörighet, om auktoriserad</text><rect fill="#FFFFFF" height="106" rx="14" ry="14" stroke="#D9E3EE" stroke-width="2" width="400" x="590" y="440" /><rect fill="#E4F7F2" height="30" rx="13" ry="13" stroke="none" stroke-width="2" width="77.0" x="609" y="454" /><text fill="#118E86" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" x="621" y="475">deploy</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="610" y="518">Privat primärgrupp</text><rect fill="#FFFFFF" height="106" rx="14" ry="14" stroke="#D9E3EE" stroke-width="2" width="400" x="590" y="570" /><rect fill="#FFF4DD" height="30" rx="13" ry="13" stroke="none" stroke-width="2" width="96.0" x="609" y="584" /><text fill="#BE7A18" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" x="621" y="605">book-api</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="610" y="648">Privat primärgrupp</text><line fill="none" marker-end="url(#arrow)" stroke="#3D6FDB" stroke-linecap="round" stroke-width="4" x1="517" x2="581" y1="363" y2="363" /><line fill="none" marker-end="url(#arrow-teal)" stroke="#118E86" stroke-linecap="round" stroke-width="4" x1="517" x2="581" y1="493" y2="493" /><line fill="none" marker-end="url(#arrow)" stroke="#BE7A18" stroke-linecap="round" stroke-width="4" x1="517" x2="581" y1="623" y2="623" /><rect fill="#FFFFFF" height="366" rx="16" ry="16" stroke="#D9E3EE" stroke-width="2" width="405" x="1070" y="310" /><text fill="#1D3045" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="23" font-weight="800" text-anchor="start" x="1092" y="358">/srv/book-api/</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="1092" y="387">Exempel: deploy skriver checkout</text><line fill="none" stroke="#D9E3EE" stroke-linecap="round" stroke-width="2" x1="1094" x2="1450" y1="408" y2="408" /><text fill="#1D3045" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="23" font-weight="800" text-anchor="start" x="1092" y="456">/etc/book-api/</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="1092" y="485">Hemligheter; root-kontrollerat</text><line fill="none" stroke="#D9E3EE" stroke-linecap="round" stroke-width="2" x1="1094" x2="1450" y1="507" y2="507" /><text fill="#1D3045" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="22" font-weight="800" text-anchor="start" x="1092" y="555">/var/log/book-api/</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="1092" y="584">Kan delas läsbart med ops-grupp</text><line fill="none" stroke="#D9E3EE" stroke-linecap="round" stroke-width="2" x1="1094" x2="1450" y1="604" y2="604" /><text fill="#118E86" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" x="1092" y="645">Ägare + grupp + rwx + hela sökvägen</text><line fill="none" marker-end="url(#arrow-teal)" stroke="#118E86" stroke-linecap="round" stroke-width="4" x1="995" x2="1060" y1="491" y2="491" /><rect fill="#182B45" height="144" rx="18" ry="18" stroke="none" stroke-width="2" width="1410" x="65" y="732" /><text fill="#91DDCE" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="start" x="96" y="778">SAMMA LINUX-MEKANISM — OLIKA SYFTEN</text><text fill="#FFFFFF" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" x="96" y="818">Människa, service account och automatisering får alla UID/GID.</text><text fill="#FFFFFF" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" x="96" y="854">sudo, katalogrättigheter och Docker-socketen avgör vad de faktiskt kan göra.</text><line fill="none" stroke="#D9E3EE" stroke-linecap="round" stroke-width="2" x1="65" x2="1475" y1="904" y2="904" /><text fill="#8295A6" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="65" y="933">Föreslagna roller — inte en avbildning av nuvarande filbehörigheter</text><text fill="#8295A6" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="end" x="1473" y="933">BOOK API  /  LINUX-PRIMER</text></svg>