<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1530px" version="1.1" viewBox="0 0 1790 1530" width="1790px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="5"><path d="M0,0 L10,5 L0,10 Z" fill="#3D6FDB" /></marker><marker id="arrow-teal" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="5"><path d="M0,0 L10,5 L0,10 Z" fill="#118E86" /></marker><marker id="arrow-muted" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="5"><path d="M0,0 L10,5 L0,10 Z" fill="#5B6F83" /></marker></defs><rect fill="#F6F9FC" height="1530" width="1790" x="0" y="0" /><rect fill="#118E86" height="15" rx="0" ry="0" stroke="none" stroke-width="2" width="1790" x="0" y="0" /><text fill="#118E86" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="19" font-weight="800" letter-spacing="1.8px" text-anchor="start" x="65" y="75">04 / NÄTVERK</text><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="44" font-weight="800" text-anchor="start" x="65" y="132">Från internet till databasen</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" x="66" y="176">Vänster: trafikväg  •  Höger: ansvar  •  Streckat: planerat eller endast logiskt samband</text><line fill="none" stroke="#D9E3EE" stroke-linecap="round" stroke-width="2" x1="65" x2="1725" y1="199" y2="199" /><rect fill="#EBF2FF" height="88" rx="16" ry="16" stroke="#3D6FDB" stroke-width="2" width="800" x="60" y="224" /><rect fill="#EBF2FF" height="30" rx="13" ry="13" stroke="none" stroke-width="2" width="65" x="78" y="238" /><text fill="#3D6FDB" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" x="90" y="259">NU</text><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" x="146" y="265">AWS inbound: TCP 22 (SSH) enligt uppgift</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="146" y="293">Publik HTTP/HTTPS stoppas av Security Group.</text><rect fill="#FFF4DD" height="88" rx="16" ry="16" stroke="#BE7A18" stroke-width="2" width="833" x="893" y="224" /><rect fill="#FFF4DD" height="30" rx="13" ry="13" stroke="none" stroke-width="2" width="77.0" x="910" y="238" /><text fill="#BE7A18" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" x="922" y="259">SENARE</text><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" x="1009" y="265">Öppna 80/443 när webb och TLS är redo</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="1009" y="293">443 = HTTPS för IPv4 och/eller IPv6.</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="start" x="85" y="358">FÖRFRÅGANS VÄG  /  FÖRENKLAT</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="start" x="1022" y="358">VARFÖR FINNS DETTA STEG?</text><rect fill="none" height="656" rx="20" ry="20" stroke="#8AB3DA" stroke-dasharray="12 10" stroke-width="2" width="904" x="59" y="645" /><text fill="#3D6FDB" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="start" x="82" y="661">EC2 / Ubuntu-host</text><rect fill="none" height="237" rx="16" ry="16" stroke="#6FB9AE" stroke-dasharray="8 8" stroke-width="2" width="838" x="92" y="1040" /><text fill="#118E86" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="108" y="1069">Docker / container-nät</text><rect fill="#FFFFFF" height="96" rx="14" ry="14" stroke="#3D6FDB" stroke-width="2" width="827" x="92" y="395" /><rect fill="#3D6FDB" height="96" rx="2" ry="2" stroke="none" stroke-width="2" width="9" x="92" y="395" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="26" font-weight="800" text-anchor="start" x="121" y="433">1   KLIENT / DNS</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="121" y="470">Domän → publik IP; Elastic IP är en möjlig IPv4-typ</text><line fill="none" marker-end="url(#arrow)" stroke="#3D6FDB" stroke-dasharray="9 9" stroke-linecap="round" stroke-width="3" x1="506" x2="506" y1="491" y2="522" /><rect fill="#FFFFFF" height="96" rx="14" ry="14" stroke="#BE7A18" stroke-width="2" width="827" x="92" y="532" /><rect fill="#BE7A18" height="96" rx="2" ry="2" stroke="none" stroke-width="2" width="9" x="92" y="532" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="26" font-weight="800" text-anchor="start" x="121" y="570">2   AWS SECURITY GROUP</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="121" y="607">Just nu: SSH/22 tillåtet. Webb 80/443 senare.</text><line fill="none" marker-end="url(#arrow)" stroke="#3D6FDB" stroke-dasharray="9 9" stroke-linecap="round" stroke-width="3" x1="506" x2="506" y1="628" y2="659" /><rect fill="#FFFFFF" height="96" rx="14" ry="14" stroke="#3D6FDB" stroke-width="2" width="827" x="92" y="669" /><rect fill="#3D6FDB" height="96" rx="2" ry="2" stroke="none" stroke-width="2" width="9" x="92" y="669" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="26" font-weight="800" text-anchor="start" x="121" y="707">3   NGINX</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="121" y="744">listen 80; planerat HTTPS via 443</text><line fill="none" marker-end="url(#arrow-teal)" stroke="#118E86" stroke-linecap="round" stroke-width="3" x1="506" x2="506" y1="765" y2="797" /><rect fill="#FFFFFF" height="96" rx="14" ry="14" stroke="#118E86" stroke-width="2" width="827" x="92" y="807" /><rect fill="#118E86" height="96" rx="2" ry="2" stroke="none" stroke-width="2" width="9" x="92" y="807" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="26" font-weight="800" text-anchor="start" x="121" y="845">4   HOST LOOPBACK</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="121" y="882">proxy_pass → http://127.0.0.1:8000</text><line fill="none" marker-end="url(#arrow-teal)" stroke="#118E86" stroke-linecap="round" stroke-width="3" x1="506" x2="506" y1="903" y2="934" /><rect fill="#FFFFFF" height="96" rx="14" ry="14" stroke="#118E86" stroke-width="2" width="827" x="92" y="944" /><rect fill="#118E86" height="96" rx="2" ry="2" stroke="none" stroke-width="2" width="9" x="92" y="944" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="26" font-weight="800" text-anchor="start" x="121" y="982">5   DOCKER PORT PUBLICERING</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="121" y="1019">127.0.0.1:8000 → container:8000</text><line fill="none" marker-end="url(#arrow-teal)" stroke="#118E86" stroke-linecap="round" stroke-width="3" x1="506" x2="506" y1="1040" y2="1082" /><rect fill="#FFFFFF" height="96" rx="14" ry="14" stroke="#118E86" stroke-width="2" width="827" x="91" y="1092" /><rect fill="#118E86" height="96" rx="2" ry="2" stroke="none" stroke-width="2" width="9" x="91" y="1092" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="26" font-weight="800" text-anchor="start" x="120" y="1130">6   API-CONTAINER</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="120" y="1167">Uvicorn :8000 → FastAPI (app.py / db.py)</text><line fill="none" marker-end="url(#arrow-teal)" stroke="#118E86" stroke-linecap="round" stroke-width="3" x1="506" x2="506" y1="1188" y2="1218" /><rect fill="#FFFFFF" height="96" rx="14" ry="14" stroke="#118E86" stroke-width="2" width="827" x="91" y="1228" /><rect fill="#118E86" height="96" rx="2" ry="2" stroke="none" stroke-width="2" width="9" x="91" y="1228" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="26" font-weight="800" text-anchor="start" x="120" y="1266">7   DB-CONTAINER</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="120" y="1303">PostgreSQL via internt db:5432</text><rect fill="#FBFCFE" height="96" rx="14" ry="14" stroke="#D9E3EE" stroke-width="1" width="735" x="990" y="395" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="1015" y="433">DNS löser namn till IP. En Elastic IP är valfri,</text><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="1015" y="463">inte något vi har bekräftat är konfigurerat.</text><rect fill="#FBFCFE" height="96" rx="14" ry="14" stroke="#D9E3EE" stroke-width="1" width="735" x="990" y="532" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="1015" y="570">Molnbrandvägg vid EC2. Regeln styr vilka</text><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="1015" y="600">anslutningar som alls får nå hosten.</text><rect fill="#FBFCFE" height="96" rx="14" ry="14" stroke="#D9E3EE" stroke-width="1" width="735" x="990" y="669" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="1015" y="707">Webbserver och reverse proxy. TLS avslutas</text><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="1015" y="737">vanligen här; Certbot hjälper med certifikat.</text><rect fill="#FBFCFE" height="96" rx="14" ry="14" stroke="#D9E3EE" stroke-width="1" width="735" x="990" y="807" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="1015" y="845">127.0.0.1 är hostens loopback-adress.</text><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="1015" y="875">Bara processer på hosten når den direkt.</text><rect fill="#FBFCFE" height="96" rx="14" ry="14" stroke="#D9E3EE" stroke-width="1" width="735" x="990" y="944" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="1015" y="982">Compose ports väljer host-IP och port samt</text><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="1015" y="1012">vilken port i containern som ska nås.</text><rect fill="#FBFCFE" height="96" rx="14" ry="14" stroke="#D9E3EE" stroke-width="1" width="735" x="990" y="1092" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="1015" y="1130">0.0.0.0 i containern = alla dess interface.</text><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="1015" y="1160">Inte samma sak som publik host-exponering.</text><rect fill="#FBFCFE" height="96" rx="14" ry="14" stroke="#D9E3EE" stroke-width="1" width="735" x="990" y="1228" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="1015" y="1266">API:n anropar tjänstnamnet db på port 5432.</text><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="1015" y="1296">Databasporten publiceras inte mot hosten.</text><rect fill="#182B45" height="89" rx="14" ry="14" stroke="none" stroke-width="2" width="1645" x="78" y="1365" /><text fill="#86E3D3" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="start" x="101" y="1403">SSH/22</text><text fill="#FFFFFF" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="245" y="1398">Administrativ anslutning till sshd. En SSH-tunnel kan ge åtkomst till 127.0.0.1:8000,</text><text fill="#FFFFFF" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="245" y="1425">men den är separat från ett framtida publikt HTTP/HTTPS-flöde.</text><line fill="none" stroke="#D9E3EE" stroke-linecap="round" stroke-width="2" x1="65" x2="1725" y1="1474" y2="1474" /><text fill="#8295A6" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="65" y="1503">IPV6 kräver även adress / routing / regler samt relevant NGINX-konfiguration</text><text fill="#8295A6" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="end" x="1723" y="1503">BOOK API  /  LINUX-PRIMER</text></svg>