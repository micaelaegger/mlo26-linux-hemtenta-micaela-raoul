<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="680px" version="1.1" viewBox="0 0 1560 680" width="1560px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="5"><path d="M0,0 L10,5 L0,10 Z" fill="#3D6FDB" /></marker><marker id="arrow-teal" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="5"><path d="M0,0 L10,5 L0,10 Z" fill="#118E86" /></marker><marker id="arrow-muted" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="5"><path d="M0,0 L10,5 L0,10 Z" fill="#5B6F83" /></marker></defs><rect fill="#F6F9FC" height="680" width="1560" x="0" y="0" /><rect fill="#118E86" height="15" rx="0" ry="0" stroke="none" stroke-width="2" width="1560" x="0" y="0" /><text fill="#118E86" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="19" font-weight="800" letter-spacing="1.8px" text-anchor="start" x="65" y="75">06 / AVVÄGNING</text><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="44" font-weight="800" text-anchor="start" x="65" y="132">När något går fel spelar gränser roll</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" x="66" y="176">Poängen är inte fler konton, utan mindre konsekvenser när en komponent får problem.</text><line fill="none" stroke="#D9E3EE" stroke-linecap="round" stroke-width="2" x1="65" x2="1495" y1="199" y2="199" /><rect fill="#FFF0EE" height="319" rx="19" ry="19" stroke="#C65B57" stroke-width="2" width="675" x="70" y="250" /><rect fill="#E8F7EC" height="319" rx="19" ry="19" stroke="#2D8A58" stroke-width="2" width="675" x="813" y="250" /><rect fill="#FFF0EE" height="32" rx="16" ry="16" stroke="none" stroke-width="2" width="300" x="97" y="274" /><text fill="#C65B57" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="112" y="297">SVÅRBEGRÄNSAD SKADA</text><rect fill="#E8F7EC" height="32" rx="16" ry="16" stroke="none" stroke-width="2" width="275" x="841" y="274" /><text fill="#2D8A58" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="856" y="297">BEGRÄNSAD ÅTKOMST</text><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="27" font-weight="800" text-anchor="start" x="100" y="359">En process kan nå för mycket</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="99" y="408">• Kör som root utan behov</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="99" y="443">• Läser deploy-nycklar och secrets</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="99" y="478">• Får tillgång till Docker-socketen</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="99" y="513">• Kan nå andra komponenters data</text><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="27" font-weight="800" text-anchor="start" x="842" y="359">En process får vad den behöver</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="841" y="408">• Kör som icke-root där möjligt</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="841" y="443">• Separata hemligheter och volymer</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="841" y="478">• Endast nödvändiga nätverksvägar</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="841" y="513">• Särskilt kontrollerad deployment</text><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" x="780" y="608">Säkerhet som reducerar risk är bra. Restriktioner utan tydligt syfte är inte ett mål i sig.</text><line fill="none" stroke="#D9E3EE" stroke-linecap="round" stroke-width="2" x1="65" x2="1495" y1="624" y2="624" /><text fill="#8295A6" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="65" y="653">Jämförelse av konsekvenser, inte en checklista som alltid kräver maximal hårdning</text><text fill="#8295A6" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="end" x="1493" y="653">BOOK API  /  LINUX-PRIMER</text></svg>