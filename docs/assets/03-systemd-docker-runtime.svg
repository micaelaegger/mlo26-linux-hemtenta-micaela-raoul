<svg baseProfile="full" height="1080px" version="1.1" viewBox="0 0 1620 1080" width="1620px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="5"><path d="M0,0 L10,5 L0,10 Z" fill="#3D6FDB" /></marker><marker id="arrow-teal" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="5"><path d="M0,0 L10,5 L0,10 Z" fill="#118E86" /></marker><marker id="arrow-muted" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="5"><path d="M0,0 L10,5 L0,10 Z" fill="#5B6F83" /></marker></defs><rect fill="#F6F9FC" height="1080" width="1620" x="0" y="0" /><rect fill="#118E86" height="15" rx="0" ry="0" stroke="none" stroke-width="2" width="1620" x="0" y="0" /><text fill="#118E86" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="19" font-weight="800" letter-spacing="1.8px" text-anchor="start" x="65" y="75">03 / PROCESSER OCH CONTAINERS</text><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="44" font-weight="800" text-anchor="start" x="65" y="132">Vem startar — och vem kör?</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" x="66" y="176">systemd, dockerd, Linuxkonton och containerprocesser har olika roller.</text><line fill="none" stroke="#D9E3EE" stroke-linecap="round" stroke-width="2" x1="65" x2="1555" y1="199" y2="199" /><rect fill="#FFFFFF" height="746" rx="22" ry="22" stroke="#D9E3EE" stroke-width="2" width="1490" x="65" y="229" /><rect fill="#EBF2FF" height="32" rx="16" ry="16" stroke="none" stroke-width="2" width="224" x="94" y="246" /><text fill="#3D6FDB" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="109" y="269">EC2 / Ubuntu-host</text><rect fill="#EBF2FF" height="175" rx="16" ry="16" stroke="#3D6FDB" stroke-width="2" width="440" x="99" y="315" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="30" font-weight="800" text-anchor="start" x="124" y="361">systemd  (PID 1)</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="124" y="397">Startar / övervakar tjänster</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="124" y="431">t.ex. nginx.service, docker.service</text><rect fill="#E4F7F2" height="175" rx="16" ry="16" stroke="#118E86" stroke-width="2" width="445" x="582" y="315" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="29" font-weight="800" text-anchor="start" x="608" y="361">Docker Engine / dockerd</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="608" y="399">Hanterar images, containers och nät</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="608" y="433">Rootful daemon: hög behörighet</text><rect fill="#FFF4DD" height="175" rx="16" ry="16" stroke="#BE7A18" stroke-width="2" width="455" x="1063" y="315" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="29" font-weight="800" text-anchor="start" x="1088" y="361">Host-konton</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="1088" y="398">deploy: begär driftsättning</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="1088" y="431">book-api: ev. hostjobb, inte runtime</text><path d="M530,400 L565,400" fill="none" marker-end="url(#arrow-muted)" stroke="#5B6F83" stroke-dasharray="8 8" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><rect fill="#FFFFFF" height="290" rx="16" ry="16" stroke="#D9E3EE" stroke-width="2" width="360" x="103" y="575" /><rect fill="#EBF2FF" height="30" rx="13" ry="13" stroke="none" stroke-width="2" width="134.0" x="121" y="592" /><text fill="#3D6FDB" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" x="133" y="613">HOST SERVICE</text><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="34" font-weight="800" text-anchor="start" x="126" y="667">NGINX</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" x="126" y="708">Reverse proxy</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="126" y="749">systemd-managed</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="126" y="790">workers: ofta www-data</text><rect fill="#F1FAF8" height="355" rx="20" ry="20" stroke="#118E86" stroke-width="2" width="1006" x="512" y="547" /><rect fill="#E4F7F2" height="32" rx="16" ry="16" stroke="none" stroke-width="2" width="208" x="533" y="562" /><text fill="#118E86" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="548" y="585">DOCKER-MILJÖ</text><rect fill="#FFFFFF" height="226" rx="16" ry="16" stroke="#D9E3EE" stroke-width="2" width="435" x="548" y="622" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="30" font-weight="800" text-anchor="start" x="570" y="662">api-container</text><text fill="#118E86" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" x="570" y="700">Uvicorn → FastAPI</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="570" y="741">app.py  •  db.py  •  Python</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="570" y="773">Processens UID finns i containern</text><rect fill="#FFFFFF" height="226" rx="16" ry="16" stroke="#D9E3EE" stroke-width="2" width="440" x="1043" y="622" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="30" font-weight="800" text-anchor="start" x="1065" y="662">db-container</text><text fill="#118E86" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" x="1065" y="700">PostgreSQL 17</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="1065" y="741">Lyssnar internt på 5432</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="1065" y="773">Data lagras i persistent volym</text><line fill="none" marker-end="url(#arrow-teal)" stroke="#118E86" stroke-linecap="round" stroke-width="4" x1="987" x2="1035" y1="728" y2="728" /><text fill="#118E86" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" x="1010" y="707">5432</text><path d="M323,490 L323,555" fill="none" marker-end="url(#arrow-muted)" stroke="#5B6F83" stroke-dasharray="8 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><path d="M809,490 L809,531" fill="none" marker-end="url(#arrow-muted)" stroke="#5B6F83" stroke-dasharray="8 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="100" y="942">Containerägarskap är inte ett Unix-filägarskap.  Docker sköter livscykeln; processer kör med sina UID.</text><line fill="none" stroke="#D9E3EE" stroke-linecap="round" stroke-width="2" x1="65" x2="1555" y1="1024" y2="1024" /><text fill="#8295A6" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="65" y="1053">Faktisk processanvändare verifieras med docker inspect och docker exec</text><text fill="#8295A6" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="end" x="1553" y="1053">BOOK API  /  LINUX-PRIMER</text></svg>