<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1130px" version="1.1" viewBox="0 0 1770 1130" width="1770px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="5"><path d="M0,0 L10,5 L0,10 Z" fill="#3D6FDB" /></marker><marker id="arrow-teal" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="5"><path d="M0,0 L10,5 L0,10 Z" fill="#118E86" /></marker><marker id="arrow-muted" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="5"><path d="M0,0 L10,5 L0,10 Z" fill="#5B6F83" /></marker></defs><rect fill="#F6F9FC" height="1130" width="1770" x="0" y="0" /><rect fill="#118E86" height="15" rx="0" ry="0" stroke="none" stroke-width="2" width="1770" x="0" y="0" /><text fill="#118E86" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="19" font-weight="800" letter-spacing="1.8px" text-anchor="start" x="65" y="75">05 / UTVECKLING, LEVERANS, DRIFT</text><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="44" font-weight="800" text-anchor="start" x="65" y="132">En kodbas — olika ansvar</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" x="66" y="176">Det är normalt att samma Git-repository finns som flera oberoende clones.</text><line fill="none" stroke="#D9E3EE" stroke-linecap="round" stroke-width="2" x1="65" x2="1705" y1="199" y2="199" /><rect fill="#FFFFFF" height="693" rx="20" ry="20" stroke="#D9E3EE" stroke-width="2" width="395" x="65" y="240" /><rect fill="#EBF2FF" height="72" rx="18" ry="18" stroke="none" stroke-width="2" width="395" x="65" y="240" /><text fill="#3D6FDB" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="23" font-weight="800" text-anchor="start" x="91" y="285">UTVECKLING</text><rect fill="#FFFFFF" height="693" rx="20" ry="20" stroke="#D9E3EE" stroke-width="2" width="389" x="487" y="240" /><rect fill="#E4F7F2" height="72" rx="18" ry="18" stroke="none" stroke-width="2" width="389" x="487" y="240" /><text fill="#118E86" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="23" font-weight="800" text-anchor="start" x="513" y="285">GITHUB + CI</text><rect fill="#FFFFFF" height="693" rx="20" ry="20" stroke="#D9E3EE" stroke-width="2" width="392" x="901" y="240" /><rect fill="#FFF4DD" height="72" rx="18" ry="18" stroke="none" stroke-width="2" width="392" x="901" y="240" /><text fill="#BE7A18" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="23" font-weight="800" text-anchor="start" x="927" y="285">DEPLOYMENT</text><rect fill="#FFFFFF" height="693" rx="20" ry="20" stroke="#D9E3EE" stroke-width="2" width="384" x="1322" y="240" /><rect fill="#EBF2FF" height="72" rx="18" ry="18" stroke="none" stroke-width="2" width="384" x="1322" y="240" /><text fill="#3D6FDB" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="23" font-weight="800" text-anchor="start" x="1348" y="285">DRIFT PÅ EC2</text><rect fill="#EBF2FF" height="131" rx="14" ry="14" stroke="none" stroke-width="2" width="336" x="94" y="343" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="27" font-weight="800" text-anchor="start" x="119" y="384">raoul / lokal clone</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="119" y="422">Egen branch • egna ändringar</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="119" y="450">push till GitHub</text><rect fill="#EBF2FF" height="131" rx="14" ry="14" stroke="none" stroke-width="2" width="336" x="94" y="507" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="27" font-weight="800" text-anchor="start" x="119" y="548">micaela / lokal clone</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="119" y="586">Egen branch • egna ändringar</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="119" y="614">push till GitHub</text><rect fill="#EFF4F8" height="150" rx="14" ry="14" stroke="none" stroke-width="2" width="336" x="94" y="698" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="23" font-weight="800" text-anchor="start" x="120" y="742">Inte en gemensam checkout</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="120" y="780">Det minskar konflikter mellan</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="120" y="810">utveckling och drift.</text><rect fill="#E4F7F2" height="142" rx="14" ry="14" stroke="none" stroke-width="2" width="336" x="514" y="343" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="26" font-weight="800" text-anchor="start" x="538" y="389">Pull request + review</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="538" y="428">Branch → tester → granskning</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="538" y="457">merge till main</text><rect fill="#E4F7F2" height="140" rx="14" ry="14" stroke="none" stroke-width="2" width="336" x="514" y="522" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start" x="537" y="567">GitHub Actions</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="538" y="607">push till main triggar CD</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="538" y="636">CI kan köras vid PR</text><rect fill="#EFF4F8" height="135" rx="14" ry="14" stroke="none" stroke-width="2" width="336" x="514" y="713" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="start" x="539" y="758">GitHub = delad källa</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="538" y="795">Inte en katalog som flera</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="538" y="824">Linuxkonton skriver i.</text><rect fill="#FFF4DD" height="205" rx="14" ry="14" stroke="none" stroke-width="2" width="336" x="929" y="344" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start" x="952" y="392">deploy (Linuxkonto)</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="952" y="433">SSH från Actions, samt vid behov</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="952" y="466">read-only key till GitHub.</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="952" y="499">Har ev. /srv/book-api-checkout.</text><rect fill="#EFF4F8" height="169" rx="14" ry="14" stroke="none" stroke-width="2" width="336" x="929" y="583" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="25" font-weight="800" text-anchor="start" x="952" y="633">Auktoriserad deploy</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="952" y="670">Uppdatera källkod / image</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="952" y="701">och begär container-recreate.</text><rect fill="#FFF0EE" height="104" rx="14" ry="14" stroke="none" stroke-width="2" width="336" x="929" y="778" /><text fill="#C65B57" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="start" x="952" y="815">Viktig gräns</text><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="952" y="848">Rootful Docker-åtkomst ≈ root.</text><rect fill="#EBF2FF" height="150" rx="14" ry="14" stroke="none" stroke-width="2" width="325" x="1350" y="343" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="27" font-weight="800" text-anchor="start" x="1375" y="390">Docker daemon</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="1375" y="430">Skapar och övervakar</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="1375" y="460">containers.</text><rect fill="#E4F7F2" height="147" rx="14" ry="14" stroke="none" stroke-width="2" width="325" x="1350" y="534" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="27" font-weight="800" text-anchor="start" x="1375" y="579">api  /  FastAPI</text><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="26" font-weight="800" text-anchor="start" x="1375" y="617">db  /  PostgreSQL</text><rect fill="#EFF4F8" height="150" rx="14" ry="14" stroke="none" stroke-width="2" width="325" x="1350" y="723" /><text fill="#1D3045" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="25" font-weight="800" text-anchor="start" x="1375" y="762">NGINX + systemd</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="1375" y="802">Hostens reverse proxy</text><text fill="#5B6F83" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="1375" y="832">och servicehantering.</text><path d="M436,423 L482,423" fill="none" marker-end="url(#arrow)" stroke="#3D6FDB" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><path d="M852,594 L896,594" fill="none" marker-end="url(#arrow-teal)" stroke="#118E86" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><path d="M1270,670 L1315,670" fill="none" marker-end="url(#arrow)" stroke="#3D6FDB" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#182B45" height="98" rx="16" ry="16" stroke="none" stroke-width="2" width="1640" x="65" y="959" /><text fill="#9CE9DA" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="25" font-weight="800" text-anchor="start" x="95" y="1000">book-api på hosten?</text><text fill="#FFFFFF" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start" x="395" y="1000">Möjligt för backup/cron — men behöver inte äga checkout, Docker eller API-processen.</text><text fill="#D5E4F2" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="95" y="1033">Alternativ: bygg image i GitHub Actions och låt EC2 endast hämta den.</text><line fill="none" stroke="#D9E3EE" stroke-linecap="round" stroke-width="2" x1="65" x2="1705" y1="1074" y2="1074" /><text fill="#8295A6" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="65" y="1103">Målbild, inte verifierat driftsläge</text><text fill="#8295A6" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="end" x="1703" y="1103">BOOK API  /  LINUX-PRIMER</text></svg>